plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.ivan.jamm'
    compileSdk 34

    defaultConfig {
        applicationId "com.ivan.jamm"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        release {
            storeFile file("jamm-release.keystore")
            storePassword System.getenv("KEYSTORE_PASSWORD") ?: "jamm123"
            keyAlias System.getenv("KEY_ALIAS") ?: "jamm"
            keyPassword System.getenv("KEY_PASSWORD") ?: "jamm123"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.json:json:20231013'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.media:media:1.7.0'
    implementation 'io.github.jan-tennert.supabase:storage-kt:2.6.0'
    implementation 'io.github.jan-tennert.supabase:gotrue-kt:2.6.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'io.ktor:ktor-client-okhttp:2.3.7'
}
